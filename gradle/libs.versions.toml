[versions]
agp = "8.13.2"
kotlin = "2.2.21"
dexlib2 = "3.0.10"
arsclib = "1.4.0"
android-tools = "8.13.2"
bouncycastle = "1.81"
compose-bom = "2025.12.01"
activity-compose = "1.13.0"
coroutines = "1.10.2"

[libraries]
dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "dexlib2" }
baksmali = { module = "com.android.tools.smali:smali-baksmali", version.ref = "dexlib2" }
arsclib = { module = "io.github.reandroid:ARSCLib", version.ref = "arsclib" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "android-tools" }
apkzlib = { module = "com.android.tools.build:apkzlib", version.ref = "android-tools" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
